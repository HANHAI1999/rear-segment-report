<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026H1 后段供应商考核报告</title>
<script src="https://unpkg.com/plotly.js@2.32.0/dist/plotly.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f7fa;color:#333}
.container{max-width:1200px;margin:0 auto;padding:20px}
h1{font-size:24px;margin-bottom:5px}
.subtitle{color:#888;font-size:13px;margin-bottom:20px}
.tabs{display:flex;gap:8px;margin-bottom:20px;background:#fff;padding:6px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);flex-wrap:wrap}
.tab-btn{padding:10px 14px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;background:transparent;color:#666;transition:all .2s}
.tab-btn:hover{background:#f0f2f5}
.tab-btn.active{background:#4472C4;color:#fff}
.tab-content{display:none;animation:fadeIn .3s}
.tab-content.active{display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card{background:#fff;border-radius:10px;padding:20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h3{font-size:17px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 10px;text-align:center;border-bottom:1px solid #eee}
th{background:#f8f9fb;font-weight:600;color:#555;font-size:11px}
tr:hover{background:#f8f9fb}
.chart{width:100%}
.caption{color:#888;font-size:12px;margin-top:8px}
.stats-row{display:flex;gap:0;width:100%;margin-bottom:14px;border-radius:10px;overflow:hidden}
.stat-card{flex:1;background:#f8f9fb;padding:14px 10px;text-align:center;border-right:1px solid #e8e8e8}
.stat-card:last-child{border-right:none}
.stat-card .val{font-size:28px;font-weight:700}
.stat-card .lbl{font-size:11px;color:#888;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.btn{padding:6px 14px;border:1px solid #ddd;border-radius:20px;cursor:pointer;font-size:12px;background:#fff;margin:0 4px 4px 0;transition:all .2s}
.btn.on{background:#4472C4;color:#fff;border-color:#4472C4}
.footer{text-align:center;color:#aaa;font-size:12px;padding:20px}
.sh{color:#2e7d32;font-weight:700}.sm{color:#e65100;font-weight:700}.sl{color:#c62828;font-weight:700}
.grp td{background:#e8eaf6!important;font-weight:700!important;font-size:13px!important;color:#283593!important;padding:8px 10px!important}
.biz{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600}
.biz-s{background:#FFF3E0;color:#E65100}.biz-z{background:#E3F2FD;color:#1565C0}.biz-h{background:#E8F5E9;color:#2E7D32}
.good{color:#2e7d32;font-size:12px;line-height:1.8}
.bad{color:#c62828;font-size:12px;line-height:1.8}
</style>
</head>
<body>
<div class="container">
<h1>📦 2026年上半年度 后段供应商考核报告</h1>
<p class="subtitle" id="updateInfo"></p>
<div class="tabs">
<button class="tab-btn active" onclick="switchTab(0)">📐 评分体系</button>
<button class="tab-btn" onclick="switchTab(1)">🗺️ 供应商分布</button>
<button class="tab-btn" onclick="switchTab(2)">📊 排名总览</button>
<button class="tab-btn" onclick="switchTab(3)">🔍 供应商详情</button>
<button class="tab-btn" onclick="switchTab(4)">📈 区域对比</button>
</div>
<div class="tab-content active" id="tab0"></div>
<div class="tab-content" id="tab1"></div>
<div class="tab-content" id="tab2"></div>
<div class="tab-content" id="tab3"></div>
<div class="tab-content" id="tab4"></div>
<div class="footer">2026上半年度·后段供应商考核报告·HANHAI</div>
</div>
<script src="report_data.js"></script>
<script src="supplier_locations.js"></script>
<script>
// ═══ 全局 ═══
const R=DATA.results.sort((a,b)=>b.total-a.total);
R.forEach((x,i)=>{
  x.rank=i+1; x.sc=x.total>=9?'sh':x.total>=8?'sm':'sl'; x.people=x.zg_n+x.gh_n;
  const bl=x.biz_label||'';
  if(bl.includes('散货')&&bl.includes('整柜'))x.btag='<span class="biz biz-h">散货+整柜</span>';
  else if(bl.includes('散货')||bl.includes('拆送'))x.btag='<span class="biz biz-s">散货</span>';
  else if(bl.includes('整柜')||bl.includes('直送'))x.btag='<span class="biz biz-z">整柜</span>';
  else x.btag='<span class="biz biz-h">散货+整柜</span>';
});
const US=R.filter(x=>x.region==='美国'),GB=R.filter(x=>x.region==='英国'),CA=R.filter(x=>x.region==='加拿大');
const ac={'美西':'#1565C0','美中':'#E65100','美湾':'#C62828','美东':'#2E7D32','全美':'#7B1FA2'},ao=['美西','美中','美湾','美东'];
document.getElementById('updateInfo').textContent='数据更新：'+DATA.updated+' | 整柜操作组5人+港后操作组17人 | '+R.length+'家供应商';

function switchTab(i){
  document.querySelectorAll('.tab-btn').forEach((b,j)=>b.classList.toggle('active',j===i));
  document.querySelectorAll('.tab-content').forEach((c,j)=>c.classList.toggle('active',j===i));
  setTimeout(()=>Plotly.Plots.resize(document.querySelector('.tab-content.active')),200);
}

// ═══  Tab0: 评分体系 ═══
(function(){
  const rows=[['服务表现','65%','提柜及时性','15%','自营仓：参考服务等级；非自盈仓：码头可提后2工作日（LFD前提完）'],['','','拆柜及时性','15%','提柜后3工作日完成'],['','','派送时效性','20%','拆柜+7天内完成交仓'],['','','还空时效性','15%','拆柜后/报空后2工作日内'],['','','亚马逊预约能力','20%','预约派送在拆柜后7天内'],['','','异常率','15%','0起：10分；2起：8分；>3起：0分'],['工作配合度','15%','路由/POD更新及时准确','20%','送货完成最晚第二天提供POD'],['','','消息/邮件回复及时性','20%','飞书15分钟内响应；邮件当天回复'],['','','风险把控','20%','实时同步行情及突发情况'],['','','异常反馈及解决方案','20%','主动反馈并提供合理方案'],['','','账单及时性+准确性','20%','自营仓：周四推送；非自营仓：3工作日内'],['总体成本','20%','共同承担成本的增长','50%','因仓位/派送被临时切割等意外成本共同承担'],['','','报价稳定性和有效性','50%','固定报价有效期为≥1个月']];
  let h=rows.map(r=>'<tr>'+r.map(c=>`<td style="font-size:11px;text-align:${r[0]?'left;font-weight:600':''}">${c}</td>`).join('')+'</tr>').join('');
  document.getElementById('tab0').innerHTML=`
    <div class="stats-row"><div class="stat-card"><div class="val" style="color:#1565C0">${US.length}</div><div class="lbl">🇺🇸 美国</div></div><div class="stat-card"><div class="val" style="color:#00838F">${CA.length}</div><div class="lbl">🇨🇦 加拿大</div></div><div class="stat-card"><div class="val" style="color:#C62828">${GB.length}</div><div class="lbl">🇬🇧 英国</div></div></div>
    <div class="card"><h3>评分模型</h3>
      <div style="background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:16px 20px;border-radius:10px;text-align:center;margin-bottom:16px"><b style="font-size:15px">总评分 = 服务表现×65% + 工作配合度×15% + 总体成本×20%</b><div style="font-size:11px;opacity:.85;margin-top:4px">1-10分制 · "/"表示不涉及 · 不计入平均</div></div>
      <table><tr><th>考核模块</th><th>模块权重</th><th>考核项</th><th>项权重</th><th>评分标准</th></tr>${h}</table></div>`;
})();

// ═══  Tab1: 供应商分布 ═══
(function(){
  const traces=[];
  Object.entries(WAREHOUSES).forEach(([name,locs])=>{
    const sup=R.find(x=>x.name===name);
    if(!sup||locs.length===0||sup.region!=='美国')return;
    const sr=sup.sub_regions||['未知'],c=ac[sr[0]]||'#999';
    traces.push({type:'scattergeo',lat:locs.map(l=>l.lat),lon:locs.map(l=>l.lon),mode:'markers+text',text:locs.map(l=>l.label),textposition:'top center',textfont:{size:9,color:c},marker:{size:10,color:c,line:{width:1,color:'#fff'}},name:name,hovertemplate:name+'<br>'+sr.join('/')+'<br>%{text}<extra></extra>'});
  });
  // 加拿大
  const caData=WAREHOUSES['佳邮（加拿大）'];
  if(caData)traces.push({type:'scattergeo',lat:caData.map(l=>l.lat),lon:caData.map(l=>l.lon),mode:'markers+text',text:caData.map(l=>l.label),textfont:{size:9,color:'#00838F'},marker:{size:10,color:'#00838F'},name:'佳邮(加拿大)',hovertemplate:'佳邮(加拿大)<br>%{text}<extra></extra>'});
  // 英国
  const gbData=WAREHOUSES['顺丰（英国）'];
  if(gbData)traces.push({type:'scattergeo',lat:gbData.map(l=>l.lat),lon:gbData.map(l=>l.lon),mode:'markers+text',text:gbData.map(l=>l.label),textfont:{size:9,color:'#6A1B9A'},marker:{size:10,color:'#6A1B9A'},name:'顺丰(英国)',hovertemplate:'顺丰(英国)<br>%{text}<extra></extra>'});
  document.getElementById('tab1').innerHTML=`
    <div class="stats-row">${ao.map(a=>`<div class="stat-card" style="background:${ac[a]}11"><div class="val" style="color:${ac[a]}">${US.filter(x=>(x.sub_regions||[]).includes(a)).length}</div><div class="lbl">${a}</div></div>`).join('')}</div>
    <div class="card"><h3>美国供应商分布图</h3><p class="caption">颜色=区域归属，点=仓库。🇨🇦加拿大：佳邮 ｜ 🇬🇧英国：顺丰</p><div class="chart" id="chartMap" style="height:420px"></div></div>`;
  setTimeout(()=>{Plotly.newPlot('chartMap',traces,{geo:{scope:'world',showland:true,landcolor:'#f8f8f8',showocean:true,oceancolor:'#e8f0fe',showcountries:true,countrycolor:'#ddd',showframe:false,center:{lat:38,lon:-98},lonaxis:{range:[-128,-65]},lataxis:{range:[25,52]},projection:{type:'albers usa'}},showlegend:true,legend:{x:1,y:1,font:{size:9}},margin:{t:10,l:10,r:10,b:10}},{responsive:true});},300);
})();

// ═══  Tab2: 排名总览 ═══
(function(){
  document.getElementById('tab2').innerHTML=`
    <div style="margin-bottom:14px;display:flex;flex-wrap:wrap;align-items:center;gap:4px"><span style="font-weight:600;font-size:13px;margin-right:6px">筛选：</span><button class="btn on" onclick="doFilter('全部',this)">全部</button><button class="btn" onclick="doFilter('美国',this)">🇺🇸 美国</button><button class="btn" onclick="doFilter('英国',this)">🇬🇧 英国</button><button class="btn" onclick="doFilter('加拿大',this)">🇨🇦 加拿大</button><span style="margin:0 6px;color:#ddd">|</span>${ao.map(a=>`<button class="btn" onclick="doFilter('${a}',this)">${a}</button>`).join('')}</div>
    <div class="grid2"><div class="card"><h3 id="rkTitle">供应商排名</h3><div id="rkTbl"></div></div><div class="card"><h3>评分对比</h3><div class="chart" id="chartBar" style="height:400px"></div></div></div>`;
  doFilter('全部',document.querySelector('.btn'));
})();
function doFilter(f,btn){
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  let L;if(f==='全部')L=R;else if(['美国','英国','加拿大'].includes(f))L=R.filter(x=>x.region===f);else L=US.filter(x=>(x.sub_regions||[]).includes(f));
  document.getElementById('rkTitle').textContent=f+' ('+L.length+'家) 均分'+(L.reduce((s,x)=>s+x.total,0)/L.length).toFixed(1);
  let t='<table><tr><th>#</th><th>供应商</th><th>区域</th><th>类型</th><th>评分</th><th>人数</th></tr>';
  L.forEach(x=>{
    const rs=(x.sub_regions||[]).filter(r=>r!=='全美');
    const rt=rs.map(r=>`<span style="color:${ac[r]||'#999'};font-size:10px;margin:0 2px">●${r}</span>`).join('');
    t+=`<tr><td>${x.rank}</td><td style="text-align:left;font-weight:600">${x.name}${x.people<3?' <span style="color:#E65100;font-size:10px">🔺</span>':''}</td><td>${rt||'—'}</td><td>${x.btag}</td><td class="${x.sc}">${x.total.toFixed(1)}</td><td style="font-size:10px;color:#888">${x.people}</td></tr>`;
  });
  document.getElementById('rkTbl').innerHTML=t+'</table>';
  const avg=L.reduce((s,x)=>s+x.total,0)/L.length;
  Plotly.newPlot('chartBar',[{type:'bar',y:L.map(x=>x.name).reverse(),x:L.map(x=>x.total).reverse(),orientation:'h',marker:{color:L.map(x=>x.total>=9?'#2e7d32':x.total>=8?'#4472C4':'#C00000').reverse()},text:L.map(x=>x.total.toFixed(1)).reverse(),textposition:'outside'}],{xaxis:{range:[0,10.5]},margin:{t:10,l:160,r:50,b:30},shapes:[{type:'line',x0:avg,x1:avg,y0:-0.5,y1:L.length-0.5,line:{dash:'dash',color:'gray'}}],annotations:[{x:avg+0.1,y:L.length-1,text:'均线'+avg.toFixed(1),showarrow:false,font:{color:'gray'},xanchor:'left'}]},{responsive:true});
}

// ═══  Tab3: 供应商详情 ═══
(function(){
  let opts='';R.forEach((x,i)=>{opts+=`<option value="${i}">${x.rank}. ${x.name} (${x.total.toFixed(1)})</option>`;});
  document.getElementById('tab3').innerHTML=`<div style="margin-bottom:10px"><select id="ss" onchange="showSup()" style="padding:10px 16px;font-size:14px;border-radius:8px;border:2px solid #e0e0e0;width:100%;max-width:420px">${opts}</select></div><div id="sd"></div>`;
  showSup();
})();
function showSup(){
  const x=R[parseInt(document.getElementById('ss').value)];
  const rs=(x.sub_regions||[]).filter(r=>r!=='全美'),rt=rs.map(r=>`<span style="color:${ac[r]||'#999'};font-weight:600;margin:0 4px">●${r}</span>`).join('');
  const gs=new Set((x.good||[]).map(g=>g.replace(/^\d+[、.]\s*/,'').trim()).filter(g=>g&&!g.includes('供应商不足')));
  const bs=new Set((x.bad||[]).map(b=>b.replace(/^\d+[、.]\s*/,'').trim()).filter(b=>b&&!b.includes('供应商不足')&&!b.includes('需要优化的')));
  document.getElementById('sd').innerHTML=`
    <div class="stats-row"><div class="stat-card"><div class="val ${x.sc}">${x.total.toFixed(1)}</div><div class="lbl">综合均分</div></div><div class="stat-card"><div class="val">${x.region}</div><div class="lbl">国家</div></div><div class="stat-card"><div class="val" style="font-size:16px">${x.btag}</div><div class="lbl">业务类型</div></div><div class="stat-card"><div class="val">${x.people}</div><div class="lbl">评分人数</div></div></div>
    ${x.supplier_intro?`<div class="card"><h3>公司介绍</h3><p style="font-size:13px;line-height:1.8;color:#444">${x.supplier_intro}</p></div>`:''}
    <div class="grid2">${x.main_biz?`<div class="card"><h3>主营业务</h3><p style="font-size:13px;color:#555">${x.main_biz.replace(/\n/g,'<br>')}</p></div>`:''}${x.curr_biz?`<div class="card"><h3>现合作业务</h3><p style="font-size:13px;color:#555">${x.curr_biz.replace(/\n/g,'<br>')}</p></div>`:''}</div>
    <div class="grid2">${x.dev_biz?`<div class="card"><h3>待开发业务</h3><p style="font-size:13px;color:#555">${x.dev_biz.replace(/\n/g,'<br>')}</p></div>`:''}${x.coverage_ports?`<div class="card"><h3>覆盖口岸</h3><p style="font-size:13px;color:#333;font-weight:600">${x.coverage_ports.replace(/\n/g,'<br>')}</p><p style="font-size:11px;color:#888;margin-top:6px">服务区域：${rt||'—'}</p></div>`:''}</div>
    ${gs.size||bs.size?`<div class="grid2">${gs.size?`<div class="card"><h3>✅ 操作优势</h3><div class="good">${[...gs].slice(0,10).map(g=>'✅ '+g).join('<br>')}</div></div>`:''}${bs.size?`<div class="card"><h3>⚠️ 待改善</h3><div class="bad">${[...bs].slice(0,10).map(b=>'⚠️ '+b).join('<br>')}</div></div>`:''}</div>`:''}`;
}

// ═══  Tab4: 区域对比 ═══
(function(){
  document.getElementById('tab4').innerHTML=`
    <div class="card"><h3>各区域供应商评分对比</h3><p class="caption">hover查看详情，点击图例筛选</p><div class="chart" id="chartAll" style="height:500px"></div></div>
    <div class="grid2"><div class="card"><h3>美西 vs 美东</h3><div class="chart" id="chartWE" style="height:300px"></div></div><div class="card"><h3>美中 vs 美湾</h3><div class="chart" id="chartMG" style="height:300px"></div></div></div>`;
  setTimeout(()=>{
    const traces=[];ao.forEach(area=>{const L=US.filter(x=>(x.sub_regions||[]).includes(area)).sort((a,b)=>b.total-a.total);traces.push({type:'bar',y:L.map(x=>x.name),x:L.map(x=>x.total),orientation:'h',name:area+' ('+L.length+'家)',marker:{color:ac[area]},text:L.map(x=>x.total.toFixed(1)),textposition:'outside'});});
    Plotly.newPlot('chartAll',traces,{barmode:'group',xaxis:{range:[0,10.5]},margin:{t:30,l:160,r:40,b:30}},{responsive:true});
    const we=US.filter(x=>(x.sub_regions||[]).includes('美西')).sort((a,b)=>b.total-a.total);
    const ee=US.filter(x=>(x.sub_regions||[]).includes('美东')).sort((a,b)=>b.total-a.total);
    Plotly.newPlot('chartWE',[{type:'bar',y:we.map(x=>x.name),x:we.map(x=>x.total),orientation:'h',name:'美西',marker:{color:'#1565C0'},text:we.map(x=>x.total.toFixed(1)),textposition:'outside'},{type:'bar',y:ee.map(x=>x.name),x:ee.map(x=>x.total),orientation:'h',name:'美东',marker:{color:'#2E7D32'},text:ee.map(x=>x.total.toFixed(1)),textposition:'outside'}],{barmode:'group',xaxis:{range:[0,10.5]},margin:{t:10,l:140,r:40,b:20}},{responsive:true});
    const mc=US.filter(x=>(x.sub_regions||[]).includes('美中')).sort((a,b)=>b.total-a.total);
    const gw=US.filter(x=>(x.sub_regions||[]).includes('美湾')).sort((a,b)=>b.total-a.total);
    Plotly.newPlot('chartMG',[{type:'bar',y:mc.map(x=>x.name),x:mc.map(x=>x.total),orientation:'h',name:'美中',marker:{color:'#E65100'},text:mc.map(x=>x.total.toFixed(1)),textposition:'outside'},{type:'bar',y:gw.map(x=>x.name),x:gw.map(x=>x.total),orientation:'h',name:'美湾',marker:{color:'#C62828'},text:gw.map(x=>x.total.toFixed(1)),textposition:'outside'}],{barmode:'group',xaxis:{range:[0,10.5]},margin:{t:10,l:140,r:40,b:20}},{responsive:true});
  },300);
})();
</script>
</body>
</html>
